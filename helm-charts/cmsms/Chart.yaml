apiVersion: v2
name: cmsms
description: CMS Made Simple. An easy to use CMS System.
annotations:
  category: CMS
  #ref: https://blog.artifacthub.io/blog/changelogs/
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: "- kind: security\n  description: Fixed PHP2Shell (CVE-2026-109618, CVE-2026-109619) — image now requires Sury php7.4 >= 1:7.4.33-31, which backports the fix from PHP 8.2.35. The package changelog is kept in the image as evidence.\n  links:\n    - name: CVE-2026-109618\n      url: https://nvd.nist.gov/vuln/detail/CVE-2026-109618\n    - name: CVE-2026-109619\n      url: https://nvd.nist.gov/vuln/detail/CVE-2026-109619\n- kind: security\n  description: Disabled PHP session upload progress and pinned it via php_admin_flag so .htaccess cannot re-enable it — defense in depth for CVE-2026-109619 and mitigation for the not yet patched CVE-2026-115560.\n  links:\n    - name: CVE-2026-115560\n      url: https://nvd.nist.gov/vuln/detail/CVE-2026-115560\n- kind: security\n  description: Fixed blueimp-file-upload CVE-2018-9206 — the vulnerable server handler is not shipped (FileManager uses its own upload handling), client scripts updated to 9.22.1, HTTP access to the handler path denied as a safeguard.\n  links:\n    - name: CVE-2018-9206\n      url: https://nvd.nist.gov/vuln/detail/CVE-2018-9206\n- kind: fixed\n  description: Redirects such as /admin → /admin/ now use the public URL from cmsms_settings.host instead of http://<host>:8080.\n- kind: fixed\n  description: cmsms_app.strategy.type Recreate no longer fails with \"rollingUpdate may not be specified\".\n- kind: fixed\n  description: Fallback to older database configuration when available.\n- kind: changed\n  description: Changed Image Source to Debian Trixie (13).\n  \n"
  artifacthub.io/signKey: |-
    fingerprint: 9A3B1FFDED5C7968555E746049E2868104D45C5C
    url: https://raw.githubusercontent.com/OLED1/oleds-helm-charts/main/oleds-charts/pgp-public-key.asc
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
