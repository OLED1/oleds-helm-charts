apiVersion: v2
name: cmsms
description: CMS Made Simple. An easy to use CMS System.
annotations:
  category: CMS
  #ref: https://blog.artifacthub.io/blog/changelogs/
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Fixed PHP2Shell (CVE-2026-109618, CVE-2026-109619) — image now requires Sury php7.4 >= 1:7.4.33-31, which backports the fix from PHP 8.2.35. The package changelog is kept in the image as evidence.
      links:
        - name: CVE-2026-109618
          url: https://nvd.nist.gov/vuln/detail/CVE-2026-109618
        - name: CVE-2026-109619
          url: https://nvd.nist.gov/vuln/detail/CVE-2026-109619
    - kind: security
      description: Disabled PHP session upload progress and pinned it via php_admin_flag so .htaccess cannot re-enable it — defense in depth for CVE-2026-109619 and mitigation for the not yet patched CVE-2026-115560.
      links:
        - name: CVE-2026-115560
          url: https://nvd.nist.gov/vuln/detail/CVE-2026-115560
    - kind: security
      description: Fixed blueimp-file-upload CVE-2018-9206 — the vulnerable server handler is not shipped (FileManager uses its own upload handling), client scripts updated to 9.22.1, HTTP access to the handler path denied as a safeguard.
      links:
        - name: CVE-2018-9206
          url: https://nvd.nist.gov/vuln/detail/CVE-2018-9206
    - kind: fixed
      description: Redirects such as /admin → /admin/ now use the public URL from cmsms_settings.host instead of http://<host>:8080.
    - kind: fixed
      description: cmsms_app.strategy.type Recreate no longer fails with "rollingUpdate may not be specified".
    - kind: fixed
      description: Fallback to older database configuration when available.
  artifacthub.io/signKey: |-
    fingerprint: 9A3B1FFDED5C7968555E746049E2868104D45C5C
    url: https://raw.githubusercontent.com/OLED1/oleds-helm-charts/development/oleds-charts/pgp-public-key.asc
# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application
# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
#version: 2.0.0 #<-- Prod Branch
version: 0.2.2-dev #<-- Dev Branch
# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.2.16"
icon: https://framalibre.org/images/logo/CMS%20Made%20Simple.png
home: https://www.cmsmadesimple.org/
maintainers:
  - name: CMS Made Simple Foundation
    url: https://www.cmsmadesimple.org/
sources:
  - https://github.com/OLED1/oleds-helm-charts/tree/main/development/cmsms/cmsms-app-src
dependencies:
  - name: mariadb
    version: 11.4.*
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: mariadb.enabled
