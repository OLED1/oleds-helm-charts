apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmsms.fullname" . }}-app
  labels:
    {{- include "cmsms.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.cmsms_app.autoscaling.enabled }}
  replicas: {{ .Values.cmsms_app.replicaCount }}
  {{- end }}
  {{- with .Values.cmsms_app.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cmsms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/db-secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.cmsms_app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cmsms.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.cmsms_app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cmsms.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.cmsms_app.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.cmsms_app.securityContext | nindent 12 }}
        image: "{{ .Values.cmsms_app.image.repository }}:{{ .Values.cmsms_app.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.cmsms_app.image.pullPolicy }}
        env:
        - name: TZ
          value: {{ .Values.cmsms_settings.app_config.timezone | default "Europe/Vienna" | quote }}
        {{- if or .Values.externalDatabase.enabled .Values.mariadb.enabled }}
        {{- $dbSecret := include "cmsms.db.secretName" . }}
        {{- $dbES := include "cmsms.db.existingSecret" . | fromYaml }}
        - name: CMSMS_DB_EXISTS
          {{- if and (not .Values.externalDatabase.enabled) .Values.cmsms_settings.install_cmsms }}
          value: "false"
          {{- else }}
          value: "true"
          {{- end }}
        {{- if .Values.externalDatabase.enabled }}
        - name: CMSMS_DB_HOST
          value: {{ required "externalDatabase.host is required" .Values.externalDatabase.host | quote }}
        - name: CMSMS_DB
          value: {{ required "externalDatabase.database is required" .Values.externalDatabase.database | quote }}
        - name: CMSMS_DB_PREFIX
          value: {{ default "cms_" .Values.externalDatabase.database_prefix | quote }}
        {{- else }}
        - name: CMSMS_DB_HOST
          value: {{ include "mariadb.primary.fullname" .Subcharts.mariadb | quote }}
        - name: CMSMS_DB
          value: {{ .Values.mariadb.auth.database | quote }}
        - name: CMSMS_DB_PREFIX
          value: {{ default "cms_" .Values.mariadb.database_prefix | quote }}
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mariadb.secretName" .Subcharts.mariadb }}
              key: mariadb-root-password
        {{- end }}
        - name: CMSMS_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ $dbSecret }}
              key: {{ $dbES.usernameKey }}
        - name: CMSMS_DB_USER_PW
          valueFrom:
            secretKeyRef:
              name: {{ $dbSecret }}
              key: {{ $dbES.passwordKey }}
        {{- end }}
        - name: CMSMS_DOMAIN
          value: {{ printf "%s://%s" (ternary "https" "http" (.Values.cmsms_settings.site_encryption_enabled | default false)) .Values.cmsms_settings.host | quote }}
        - name: CMSMS_INSTALL
          value: {{ .Values.cmsms_settings.install_cmsms | default false | toString | quote }}
        - name: CMSMS_SMTP_PRECONFIGURE
          value: {{ .Values.cmsms_settings.setup_smtp.preconfigure_smtp | default false | toString | quote }}
        {{- if .Values.cmsms_settings.install_cmsms }}
        {{- if .Values.cmsms_settings.initial_user.create }}
        {{- $iuSecret := include "cmsms.initialUser.secretName" . }}
        {{- $iuES := include "cmsms.initialUser.existingSecret" . | fromYaml }}
        - name: CMSMS_APP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ $iuSecret }}
              key: {{ $iuES.usernameKey }}
        - name: CMSMS_APP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $iuSecret }}
              key: {{ $iuES.passwordKey }}
        - name: CMSMS_APP_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ $iuSecret }}
              key: {{ $iuES.emailKey }}
        {{- end }}
        {{- $smtp := .Values.cmsms_settings.setup_smtp }}
        {{- if $smtp.preconfigure_smtp }}
        - name: CMSMS_SMTP_HOST
          value: {{ required "cmsms_settings.setup_smtp.smtp_host is required" $smtp.smtp_host | quote }}
        - name: CMSMS_SMTP_PORT
          value: {{ $smtp.smtp_port | default 465 | quote }}
        - name: CMSMS_SMTP_FROM
          value: {{ $smtp.smtp_from | default "info@example.com" | quote }}
        - name: CMSMS_SMTP_SENDERRNAME
          value: {{ $smtp.smtp_sender_name | default "My Example Site" | quote }}
        - name: CMSMS_SMTP_AUTH_NEEDED
          value: {{ $smtp.smtp_auth.auth_needed | default false | toString | quote }}
        {{- if $smtp.smtp_auth.auth_needed }}
        {{- $smtpSecret := include "cmsms.smtp.secretName" . }}
        {{- $smtpES := include "cmsms.smtp.existingSecret" . | fromYaml }}
        - name: CMSMS_SMTP_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: {{ $smtpSecret }}
              key: {{ $smtpES.usernameKey }}
        - name: CMSMS_SMTP_AUTH_PW
          valueFrom:
            secretKeyRef:
              name: {{ $smtpSecret }}
              key: {{ $smtpES.passwordKey }}
        {{- end }}
        - name: CMSMS_SMTP_AUTH_ENCRYPTION
          {{- $enc := $smtp.smtp_auth.auth_encryption | default "none" | toString | lower }}
          value: {{ ternary "" $enc (eq $enc "none") | quote }}
        {{- end }}
        {{- end }}
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        {{- if .Values.cmsms_app.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /admin/login.php
            port: http
            httpHeaders:
            - name: Host
              value: {{ .Values.cmsms_settings.host | quote }}
          initialDelaySeconds: {{ .Values.cmsms_app.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.cmsms_app.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.cmsms_app.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.cmsms_app.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.cmsms_app.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.cmsms_app.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /admin/login.php
            port: http
            httpHeaders:
            - name: Host
              value: {{ .Values.cmsms_settings.host | quote }}
          initialDelaySeconds: {{ .Values.cmsms_app.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.cmsms_app.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.cmsms_app.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.cmsms_app.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.cmsms_app.readinessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.cmsms_app.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: /admin/login.php
            port: http
            httpHeaders:
            - name: Host
              value: {{ .Values.cmsms_settings.host | quote }}
          initialDelaySeconds: {{ .Values.cmsms_app.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.cmsms_app.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.cmsms_app.startupProbe.timeoutSeconds }}
          successThreshold: {{ .Values.cmsms_app.startupProbe.successThreshold }}
          failureThreshold: {{ .Values.cmsms_app.startupProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.cmsms_app.resources | nindent 12 }}
        volumeMounts:
        - name: cmsms-data
          mountPath: /var/www/html/modules
          subPath: modules
        - name: cmsms-data
          mountPath: /var/www/html/uploads
          subPath: uploads
        - name: cmsms-config
          mountPath: /var/www/html/config.php
          subPath: config.php
        {{- range $key, $value := .Values.cmsms_settings.app_config.php_ini_config }}
        - name: php-ini-config
          mountPath: /usr/local/etc/php/conf.d/{{ $key }}
          subPath: {{ $key }}
        {{- end }}
        {{- if or .Values.cmsms_settings.app_config.htaccess.use_default_htaccess .Values.cmsms_settings.app_config.htaccess.custom_htaccess }}
        - name: cmsms-htaccess
          mountPath: /var/www/html/.htaccess
          subPath: .htaccess
        {{- end }}
      volumes:
      - name: cmsms-data
      {{- if .Values.cmsms_app.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.cmsms_app.persistence.existingClaim | default (printf "%s-cmsms-data" (include "cmsms.fullname" .)) }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      - name: cmsms-config
        configMap:
          name: {{ include "cmsms.fullname" . }}-config
      - name: php-ini-config
        configMap:
          name: {{ include "cmsms.fullname" . }}-php-ini-config
      {{- if or .Values.cmsms_settings.app_config.htaccess.use_default_htaccess .Values.cmsms_settings.app_config.htaccess.custom_htaccess }}
      - name: cmsms-htaccess
        configMap:
          name: {{ include "cmsms.fullname" . }}-cmsms-htaccess
      {{- end }}
      {{- with .Values.cmsms_app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cmsms_app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cmsms_app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}