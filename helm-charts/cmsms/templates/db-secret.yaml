{{- if eq (include "cmsms.db.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cmsms.db.secretName" . }}
  labels:
    {{- include "cmsms.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.externalDatabase.enabled }}
  db-username: {{ default "cmsms" .Values.externalDatabase.user | b64enc | quote }}
  db-password: {{ required "externalDatabase.password is required" .Values.externalDatabase.password | b64enc | quote }}
  {{- else if .Values.mariadb.auth.existingSecret }}
  {{- $auth := .Values.cmsms_settings.db_authentication }}
  db-username: {{ default .Values.mariadb.auth.username $auth.username | b64enc | quote }}
  db-password: {{ required "cmsms_settings.db_authentication.password (or .existingSecret) is required when mariadb.auth.existingSecret is set" $auth.password | b64enc | quote }}
  {{- else }}
  db-username: {{ default "cmsms" .Values.mariadb.auth.username | b64enc | quote }}
  db-password: {{ required "mariadb.auth.password is required" .Values.mariadb.auth.password | b64enc | quote }}
  {{- end }}
{{- end }}