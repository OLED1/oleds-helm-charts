{{- $iu := .Values.cmsms_settings.initial_user }}
{{- $smtp := .Values.cmsms_settings.setup_smtp }}
{{- $iuES := include "cmsms.initialUser.existingSecret" . | fromYaml }}
{{- $smtpES := include "cmsms.smtp.existingSecret" . | fromYaml }}
{{- $renderUser := and .Values.cmsms_settings.install_cmsms $iu.create (not $iuES.name) }}
{{- $renderSmtp := and .Values.cmsms_settings.install_cmsms $smtp.preconfigure_smtp $smtp.smtp_auth.auth_needed (not $smtpES.name) }}
{{- if or $renderUser $renderSmtp }}
{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cmsms.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $renderUser }}
  cmsms_username: {{ default "cmsms" $iu.username | b64enc | quote }}
  {{- if $iu.password }}
  cmsms_password: {{ $iu.password | b64enc | quote }}
  {{- else if hasKey $existing "cmsms_password" }}
  cmsms_password: {{ index $existing "cmsms_password" | quote }}
  {{- else }}
  cmsms_password: {{ randAlphaNum 25 | b64enc | quote }}
  {{- end }}
  cmsms_email: {{ default "admin@example.com" $iu.email | b64enc | quote }}
  {{- end }}
  {{- if $renderSmtp }}
  cmsms_smtp_username: {{ required "cmsms_settings.setup_smtp.smtp_auth.auth_user is required" $smtp.smtp_auth.auth_user | b64enc | quote }}
  cmsms_smtp_password: {{ required "cmsms_settings.setup_smtp.smtp_auth.auth_pw is required" $smtp.smtp_auth.auth_pw | b64enc | quote }}
  {{- end }}
{{- end }}